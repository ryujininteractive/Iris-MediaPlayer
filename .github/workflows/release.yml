# Builds the Iris installer and update packages from the public source.
#
# - Push a tag like v1.3.1 (matching <Version> in Iris-MediaPlayer.csproj): builds, packs with
#   Velopack and creates a DRAFT GitHub release with the files. Nothing is public until the draft
#   is published by hand.
# - "Run workflow" on the Actions tab: builds and keeps the files as a downloadable artifact only.
#
# It also builds the Microsoft Store package (build-msix.ps1) and keeps the .msixupload as the
# "iris-<version>-store" artifact, to submit in Partner Center. The Store signs it.
#
# This workflow holds no keys. The release is uploaded to the update server from the maintainer's
# PC with `build-installer.cmd -FromGitHub <tag>`.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write   # to create the draft release
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          [xml] $project = Get-Content Iris-MediaPlayer/Iris-MediaPlayer.csproj
          $version = $project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
          if (-not $version) { throw 'No <Version> in Iris-MediaPlayer.csproj.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag $env:GITHUB_REF_NAME doesn't match <Version> $version. Tag the commit as v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and pack
        shell: pwsh
        run: |
          # Tag builds start from the published release so installed copies get a small delta update.
          # Manual runs are test builds of the current version, packed on their own.
          if ($env:GITHUB_REF_TYPE -eq 'tag') { ./build-installer.ps1 } else { ./build-installer.ps1 -SkipPrevious }

      # Code signing (SignPath) goes here once the project is approved: sign the app before packing
      # and the setup after it.

      - name: Build the Microsoft Store package
        shell: pwsh
        run: ./build-msix.ps1

      - name: Keep the Store package
        uses: actions/upload-artifact@v4
        with:
          name: iris-${{ steps.version.outputs.version }}-store
          path: artifacts/msix/*.msixupload
          if-no-files-found: error
          retention-days: 30

      - name: Collect this version's files
        shell: pwsh
        run: |
          # The folder also holds the previous release (fetched to make the delta update); keep only
          # this version's packages, the setup, the portable zip and the release feeds.
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem artifacts/releases -File |
            Where-Object { ($_.Extension -ne '.nupkg' -or $_.Name -like "*-$version-*") -and $_.Name -notmatch '-v\d[\d.]*\.exe$' } |
            Copy-Item -Destination out
          Get-ChildItem out | Format-Table Name, Length

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: iris-${{ steps.version.outputs.version }}
          path: out/
          retention-days: 14

      - name: Create a draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem out -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME $files --draft --verify-tag `
            --title "Iris ${{ steps.version.outputs.version }}" `
            --notes "Iris ${{ steps.version.outputs.version }} for Windows (x64). Download IrisMediaPlayer-win-Setup.exe to install, or the portable zip. Prefer a signed version? Get Iris from the Microsoft Store: https://apps.microsoft.com/detail/9PBKP3C8TB98"
